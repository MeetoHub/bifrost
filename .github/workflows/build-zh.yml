# Build the upstream Bifrost image from dev, which ships the complete Simplified
# Chinese catalogs, and publish it to GHCR so the meethub deployment can pull a
# Chinese-speaking build without compiling on a small server.
name: build-zh

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/build-zh.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: transports/Dockerfile
          push: true
          tags: |
            ghcr.io/meetohub/bifrost:zh
            ghcr.io/meetohub/bifrost:zh-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max